      if (key === "ping") { termLine("Initiating Ping Scan at " + clock(S.sim)); termLine("Scanning " + nTargets + " host" + (nTargets > 1 ? "s" : "") + " [4 ports/host]"); }
      else if (key === "dns") termLine("Initiating Parallel DNS resolution of " + Math.max(1, upHosts()) + " host(s). at " + clock(S.sim));
      else if (key === S.phaseKey) { termLine("Initiating " + name + " at " + clock(S.sim)); termLine("Scanning " + upHosts() + " host(s) [" + portCountS(s) + " ports/host]"); }
      else termLine("Initiating " + name + " at " + clock(S.sim));
    }
    paint();
    const steps = 12, stepMs = durs[i] / steps;
    const openList = [];
    if (key === S.phaseKey) S.hosts.forEach((h) => h.ports.forEach((p) => { if (p.state === "open") openList.push([h, p]); }));
    let shown = 0;
    for (let k = 1; k <= steps; k++) {
      await sleep(stepMs); if (!alive()) return;
      doneMs += stepMs; S.sim = doneMs * secPerMs; S.progress = doneMs / sumMs;
      const frac = k / steps;
      if (key === "ping") S.hosts.forEach((h, j) => { if (j < Math.ceil(S.hosts.length * frac)) h.up = true; });
      if (key === S.phaseKey) {
        const target = Math.floor(openList.length * frac);
        while (shown < target) { const pair = openList[shown++]; pair[0].found++; if (verbose) termLine("Discovered open port " + pair[1].port + "/" + (S.tech === "sU" ? "udp" : "tcp") + " on " + pair[0].ip, "o"); }
        if (k === 6) termLine(name + " Timing: About " + (frac * 100).toFixed(2) + "% done; ETC: " + clock(t0 + (S.sim - t0) / frac) + " (" + hms((S.sim - t0) / frac - (S.sim - t0)) + " remaining)", "s");
      }
      if ((key === "service" || key === "os" || key === "nse") && k === 6) termLine("Stats: " + hms(S.sim) + " elapsed; " + upHosts() + " undergoing " + name, "s");
      paint();
    }
    if (key === "dns") S.hosts.forEach((h) => { h.named = true; });
    if (key === "service") S.hosts.forEach((h) => { h.ver = true; });
    if (key === "os") S.hosts.forEach((h) => { h.osk = true; });
    if (key === "nse") S.hosts.forEach((h) => { h.scr = true; });
    if (key === S.phaseKey) S.hosts.forEach((h) => { h.found = h.ports.filter((p) => p.state === "open").length; });
    if (verbose && key !== "report") termLine("Completed " + name + " at " + clock(S.sim) + ", " + (S.sim - t0).toFixed(2) + "s elapsed");
    P.secs = S.sim - t0; P.state = "done";
    if (key === "report") writeReport();
    paint();
  }
  S.status = "done"; S.progress = 1; paint();
}

function writeReport() {
  const S = scan, s = S.s, tech = S.tech, scAny = S.scAny;
  const proto = tech === "sU" ? "udp" : "tcp";
  S.hosts.forEach((h) => {
    termLine("");
    const nm = s.f.dns !== "n" && h.name ? h.name + " (" + h.ip + ")" : h.ip;
    if (h.listed) { termLine("Nmap scan report for " + nm + " [host down? not scanned]", "h"); return; }
    termLine("Nmap scan report for " + nm, "h");
    termLine(h.assumed ? "Host is up." : "Host is up (" + h.latency + "s latency).");
    if (tech) {
      const total = portCountS(s), notShown = total - h.ports.length;
      if (notShown > 0) termLine("Not shown: " + notShown + " " + (tech === "sU" ? "closed udp ports (port-unreach)" : "closed tcp ports (" + (tech === "sT" ? "conn-refused" : "reset") + ")"));
      const showVer = s.v.sV || s.v.A;
      const hdr = ["PORT", "STATE", "SERVICE", s.v.reason ? "REASON" : null, showVer ? "VERSION" : null];
      const rows = h.ports.map((p) => [p.port + "/" + proto, p.state, p.service, s.v.reason ? reasonFor(p, tech) : null, showVer ? p.version : null]);
      const wd = hdr.map((x, i) => x === null ? 0 : Math.max(x.length, ...rows.map((r) => (r[i] || "").length)) + 1);
      const fmt = (r) => r.map((c, i) => c === null ? "" : (i === r.length - 1 ? c : pad(c, wd[i]))).join("").trimEnd();
      if (rows.length) { termLine(fmt(hdr)); h.ports.forEach((p, j) => { termLine(fmt(rows[j]), p.state === "open" ? "o" : ""); if ((scAny || s.v.A) && p.scripts) p.scripts.forEach((sl, k) => termLine((k === p.scripts.length - 1 ? "|_" : "| ") + sl)); }); }
      if (h.mac) termLine("MAC Address: " + h.mac + " (" + h.vendor + ")");
      if (s.v.O || s.v.A) { termLine("Device type: general purpose"); termLine("OS details: " + h.os); termLine("Network Distance: " + Math.max(1, h.hops) + " hops"); }
    } else if (h.mac) termLine("MAC Address: " + h.mac + " (" + h.vendor + ")");
  });
  termLine("");
  if (s.v.oA) termLine("# saved: " + s.v.oA + ".nmap, " + s.v.oA + ".xml, " + s.v.oA + ".gnmap", "d");
  const n = S.ds.network ? S.ds.total : 1, up = S.hosts.filter((h) => h.up).length;
  termLine("Nmap done: " + n + " IP address" + (n > 1 ? "es" : "") + " (" + up + " host" + (up !== 1 ? "s" : "") + " up) scanned in " + S.sim.toFixed(2) + " seconds", "c");
}

let paintQueued = false;
function paint() { if (paintQueued) return; paintQueued = true; requestAnimationFrame(() => { paintQueued = false; renderHeader(); if (ui.screen === "scan") renderScan(); }); }

function renderScan() {
  const root = $("#s-scan");
  if (!scan) { root.innerHTML = '<div class="panel empty"><h2>No scan yet</h2><p>Build a command, read what each part does, then press Run scan. Results show up here while Nmap works.</p><button class="btn primary" data-go="build">Open the builder</button></div>'; return; }
  const S = scan, s = S.s;
  const termEl = root.querySelector(".term.main");
  const stick = !termEl || termEl.scrollTop + termEl.clientHeight >= termEl.scrollHeight - 30;
  const pct = Math.round(S.progress * 100), cur = S.phases[S.cur];
  const up = S.hosts.filter((h) => h.up).length, open = S.hosts.reduce((a, h) => a + h.found, 0);
  const remain = S.live ? S.remain : Math.max(0, S.totalSec - S.sim);
  let now;
  if (S.error) now = '<div class="phase-now"><strong>Nmap reported an error</strong><span>' + esc(S.error) + "</span></div>";
  else if (S.status === "running") now = '<div class="phase-now"><strong>' + PHASES[cur.key].name + "</strong><span>" + PHASES[cur.key].plain + "</span></div>";
  else if (S.status === "done") now = '<div class="phase-now"><strong>Finished</strong><span>' + (S.listOnly ? up + " target(s) listed. No ports were scanned (-sL)." : up + " host" + (up !== 1 ? "s" : "") + " up" + (S.tech ? ", " + open + " open port" + (open !== 1 ? "s" : "") : "") + ". Select a host to see what it means.") + "</span></div>";
  else if (S.saved) now = '<div class="phase-now"><strong>Did not finish</strong><span>This saved scan was stopped before Nmap was done. It shows what Nmap had found by then.</span></div>';
  else now = '<div class="phase-now"><strong>Stopped</strong><span>You stopped the scan during ' + PHASES[cur.key].name + ". Results so far are kept.</span></div>";
  if (S.hints && S.hints.length) now += S.hints.map((t) => '<div class="phase-now"><strong>What this means</strong><span>' + esc(t) + "</span></div>").join("");
  const dl = S.savedId && S.status !== "running" ? '<button class="btn" data-dl="report" data-scan="' + esc(S.savedId) + '">Download report</button><button class="btn" data-dl="xml" data-scan="' + esc(S.savedId) + '">XML</button>' : "";
  const head = '<div class="panel scanhead"><div class="sh-top"><div style="min-width:0"><div class="eyebrow">' + (S.saved ? "Saved scan from " + esc(S.savedAt) : S.live ? "Live scan - nmap " + esc(env.nmapVersion) + " on this machine" : "Simulated scan - no packets are sent in demo mode") + '</div><code class="sh-cmd">' + esc(S.displayCmd) + "</code></div>" +
    '<div class="sh-actions">' + (S.status === "running" ? '<button class="btn danger" id="stop">Stop</button>' : dl + '<button class="btn" data-go="build">Edit command</button><button class="btn primary" id="rerun">Run again</button>') + "</div></div>" +
    '<div class="progress' + (S.status === "done" ? " done" : S.status === "stopped" ? " stopped" : "") + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="bar" style="width:' + pct + '%"></div></div>' +
    '<div class="sh-meta"><span><b>' + pct + "%</b></span><span>Elapsed <b>" + hms(S.sim) + "</b></span>" + (S.status === "running" && remain !== null ? "<span>Remaining <b>" + hms(remain) + "</b></span>" : "") + "<span><b>" + up + "</b> host" + (up !== 1 ? "s" : "") + " up</span>" + (S.tech ? "<span><b>" + open + "</b> open port" + (open !== 1 ? "s" : "") + "</span>" : "") + "</div>" + now + "</div>";
  const tabs = [["results", "Results"], ["packets", "Packets"], ["terminal", "Terminal"], ["timeline", "What is happening"]];
  const sub = '<div class="subtabs" role="tablist">' + tabs.map((t) => '<button class="subtab" role="tab" data-sub="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + (t[0] === "packets" && !(S.live && S.realOut && S.s.v.packetTrace) ? "<small>Example</small>" : "") + "</button>").join("") + "</div>";
  let body;
  if (S.tab === "results") body = renderResults();
  else if (S.tab === "terminal") body = '<pre class="term main">' + (S.termDropped ? '<span class="d"># ' + S.termDropped.toLocaleString("en-US") + " earlier lines are hidden to keep the page fast. Only the latest " + TERM_MAX.toLocaleString("en-US") + " are shown.</span>\n" : "") + S.term.map((l) => l[1] ? '<span class="' + l[1] + '">' + esc(l[0]) + "</span>" : esc(l[0])).join("\n") + "</pre>";
  else if (S.tab === "timeline") body = renderTimeline();
  else body = renderPackets();
  root.innerHTML = head + sub + '<div class="scanbody">' + body + "</div>";
  const t2 = root.querySelector(".term.main"); if (t2 && stick) t2.scrollTop = t2.scrollHeight;
}

function renderResults() {
  const S = scan, s = S.s;
  const visible = S.hosts.map((h, i) => [h, i]).filter((x) => x[0].up);
  if (!visible.length) {
    if (S.status === "running") return '<div class="panel empty"><h2>Looking for hosts</h2><p>' + PHASES.ping.plain + "</p></div>";
    if (S.error) return '<div class="panel empty"><h2>No results</h2><p>Nmap stopped before it could report any host. The message above says why.</p></div>';
    if (S.status === "stopped") return '<div class="panel empty"><h2>No hosts yet</h2><p>The scan was stopped before Nmap found a host.</p></div>';
    return '<div class="panel empty"><h2>No host answered</h2><p>Nmap finished without finding a host that is up. Check the address, or if you know the host is on, try Skip discovery (-Pn).</p></div>';
  }
  if (!visible.some((x) => x[1] === S.selHost)) S.selHost = visible[0][1];
  const rows = visible.map((x) => {
    const h = x[0], i = x[1];
    const openP = h.ports.filter((p) => p.state === "open").slice(0, h.found);
    const pc = !S.tech ? '<span class="muted">' + (S.listOnly ? "listed" : "not scanned") + "</span>" : openP.length ? '<div class="pchips">' + openP.slice(0, 5).map((p) => "<code>" + p.port + "</code>").join("") + (openP.length > 5 ? '<span class="muted">+' + (openP.length - 5) + "</span>" : "") + "</div>" : '<span class="muted">' + (S.status === "running" && S.phases[S.cur].key === S.phaseKey ? "scanning..." : "none") + "</span>";
    const name = s.f.dns === "n" ? '<span class="muted">-n</span>' : h.named ? esc(h.name || "") : '<span class="muted">...</span>';
    const dev = h.self ? "This machine" : h.osk ? esc(h.os) : h.vendor ? esc(h.vendor) : '<span class="muted">' + (S.tech && (s.v.O || s.v.A) && S.status === "running" ? "pending" : "unknown") + "</span>";
    const stx = h.listed ? "assumed" : h.assumed ? "assumed" : "up";
    return '<tr data-host="' + i + '" class="' + (i === S.selHost ? "sel" : "") + '"><td class="addr">' + h.ip + "</td><td>" + name + '</td><td><span class="st ' + stx + '">' + (h.listed ? "listed" : h.assumed ? "assumed" : "up") + "</span></td><td>" + pc + "</td><td>" + dev + "</td></tr>";
  }).join("");
  const down = S.ds.network && S.status === "done" && !S.listOnly ? '<p class="src" style="padding:10px 12px">' + (S.ds.total - S.hosts.length) + " other addresses did not answer and are not shown.</p>" : "";
  const table = '<div class="panel"><div class="tablewrap"><table class="grid"><thead><tr><th>Address</th><th>Name</th><th>Status</th><th>Open ports</th><th>Device / OS</th></tr></thead><tbody>' + rows + "</tbody></table></div>" + down + "</div>";
  return '<div class="results">' + table + renderDetail(S.hosts[S.selHost]) + "</div>";
}

function renderDetail(h) {
  const S = scan, s = S.s, tech = S.tech, proto = tech === "sU" ? "udp" : "tcp";
  const facts = '<div class="d-facts">' +
    '<div class="fact"><span>Latency</span><strong>' + (h.assumed || h.listed ? "not measured" : (parseFloat(h.latency) * 1000).toFixed(2) + " ms") + "</strong></div>" +
    (h.mac ? '<div class="fact"><span>Hardware</span><strong>' + esc(h.vendor) + "</strong></div>" : "") +
    ((s.v.O || s.v.A) && tech ? '<div class="fact"><span>OS guess</span><strong>' + (h.osk ? esc(h.os) : S.status === "running" ? "pending" : "Not identified") + "</strong></div>" : "") +
    '<div class="fact"><span>Device</span><strong>' + esc(h.device) + "</strong></div></div>";
  let out = '<div class="panel detail"><div><h3>' + esc(s.f.dns !== "n" && h.named && h.name ? h.name : h.ip) + '</h3><div class="d-sub">' + h.ip + (h.mac ? " - " + h.mac : "") + "</div></div>" + facts;
  if (!tech) { out += '<div class="why"><h4>' + (S.listOnly ? "List scan" : "Ping scan only") + '</h4><p>' + (S.listOnly ? "This target was listed but not scanned, because the command used -sL." : "This host answered, but no ports were checked because the command used -sn.") + '</p><div class="acts"><button class="linkbtn" data-portscan="' + h.ip + '">Build a port scan for ' + h.ip + "</button></div></div></div>"; return out; }
  const ports = h.ports.filter((p) => p.state !== "open" || h.ports.filter((q) => q.state === "open").indexOf(p) < h.found);
  if (!ports.length) { out += '<div class="why"><h4>' + (S.status === "done" ? "No open ports here" : "Scanning ports") + "</h4><p>" + (S.status === "done" ? "Every scanned port was closed or filtered." : PHASES[S.phaseKey].plain) + "</p></div></div>"; return out; }
  if (S.selPort === null || !ports.find((p) => p.port === S.selPort)) S.selPort = ports[0].port;
  const showVer = s.v.sV || s.v.A, scAny = S.scAny || s.v.A;
  out += '<div class="tablewrap"><table class="grid"><thead><tr><th>Port</th><th>State</th><th>Service</th>' + (showVer ? "<th>Version</th>" : "") + "</tr></thead><tbody>" +
    ports.map((p) => '<tr data-port="' + p.port + '" class="' + (p.port === S.selPort ? "sel" : "") + '"><td class="addr">' + p.port + "/" + (p.proto || proto) + '</td><td><span class="st ' + stClass(p.state) + '">' + p.state + "</span></td><td>" + esc(p.service) + "</td>" + (showVer ? '<td class="ver">' + (h.ver ? esc(p.version || "unknown") : '<span class="muted">pending</span>') + (scAny && h.scr && p.scripts ? '<pre class="scripts">' + esc(p.scripts.join("\n")) + "</pre>" : "") + "</td>" : "") + "</tr>").join("") + "</tbody></table></div>";
  const p = ports.find((x) => x.port === S.selPort);
  out += '<div class="why"><h4>Port ' + p.port + " is " + p.state + (s.v.reason ? " - reason: " + reasonFor(p, tech) : "") + "</h4><p>" + esc(reasonPlain(p, tech)) + "</p>" + (p.note ? '<p class="note">' + esc(p.note) + "</p>" : "") + '<div class="acts"><button class="linkbtn" data-sub="packets">See the packets for this port</button></div></div></div>';
  return out;
}

function renderTimeline() {
  const S = scan;
  return '<ol class="panel timeline">' + S.phases.map((p) => {
    const P = PHASES[p.key];
    const cls = (p.state === "current" || p.state === "pending") && S.status === "stopped" ? "skipped" : p.state;
    const t = p.state === "done" ? p.secs.toFixed(1) + " s" : p.state === "current" && S.status === "running" ? "running" : S.status === "stopped" && p.state !== "done" ? "not run" : "waiting";
    return '<li class="ph ' + cls + '"><span class="mk" aria-hidden="true"></span><h4>' + P.name + (P.flag ? ' <code class="f">' + esc(P.flag) + "</code>" : "") + '</h4><span class="t">' + t + "</span><p>" + P.plain + "</p></li>";
  }).join("") + "</ol>";
}

// What a check of port p looks like on the wire, worked out from its result.
function exampleSeq(p, tech) {
  if (tech === "sU") {
    if (p.state === "open") return { seq: [["out", "UDP probe"], ["in", "UDP reply"]], cap: "The service answered the probe, so the port is open." };
    if (p.state === "closed") return { seq: [["out", "UDP probe"], ["in rst", "ICMP port unreachable"]], cap: "The host reported that nothing listens on this port." };
    return { seq: [["out", "UDP probe"], ["lost", "no reply"], ["out", "UDP probe (retry)"], ["lost", "no reply"]], cap: "Silence could mean a silent service or a firewall, so Nmap reports open|filtered." };
  }
  if (p.state === "open" && tech !== "sT") return { seq: [["out", "SYN"], ["in", "SYN/ACK"], ["out", "RST"]], cap: "Nmap never completes the handshake. Its RST cancels the connection before it exists, which is why this is called a half-open scan." };
  if (p.state === "open") return { seq: [["out", "SYN"], ["in", "SYN/ACK"], ["out", "ACK"], ["out", "RST (close)"]], cap: "The full handshake completes, so a real connection opens and the service may log it. Nmap closes it at once." };
  if (p.state === "closed") return { seq: [["out", "SYN"], ["in rst", "RST/ACK"]], cap: "Nothing listens here, so the host rejects the SYN immediately." };
  return { seq: [["out", "SYN"], ["lost", "no reply"], ["out", "SYN (retry)"], ["lost", "no reply"]], cap: "Nmap retries once, then marks the port filtered." };
}
// rows: [dir, label, time-or-null]; dir is out, in, "in rst" or lost.
function pkLadder(me, peer, rows) {
  const tm = (t) => (t === null || t === undefined ? "" : (+t).toFixed(4) + "s");
  return '<div class="ladder"><div class="lrow ends"><div><b>You</b><code>' + esc(me) + '</code></div><span></span><div><b>Host</b><code>' + esc(peer) + "</code></div></div>" +
    rows.map((r) => {
      const dir = r[0], lost = dir === "lost";
      return '<div class="lrow"><span class="lt">' + (dir === "out" || lost ? tm(r[2]) : "") + '</span><div class="track"><span class="alabel' + (lost ? " lost" : "") + '">' + esc(r[1]) + '</span><span class="arrow ' + (dir === "out" ? "" : dir) + '"></span></div><span class="lt">' + (dir.startsWith("in") ? tm(r[2]) : "") + "</span></div>";
    }).join("") + "</div>";
}
const pkRows = (list) => list.map((pk) => [pk.dir === "out" ? "out" : /RST|unreachable/.test(pk.label) ? "in rst" : "in", pk.label + (pk.guess ? " *" : ""), pk.t]);
function discCaption(list) {
  if (list.some((pk) => pk.proto === "arp")) return "On the local network Nmap asks with ARP who owns the address. An answer proves the host is on, so Nmap needs no other probe.";
  if (list.some((pk) => pk.proto === "nd")) return "This is the IPv6 version of ARP: Nmap asks who has the address, and the host's answer proves it is on.";
  if (list.some((pk) => pk.dir === "in")) return "The host answered Nmap's discovery probes, which proves it is on.";
  return "Nmap sent discovery probes to this address.";
}
const CONN_PLAIN = { "Connected": "connected, so the port is open", "Connection refused": "refused, so the port is closed", "Operation now in progress": "attempt started, waiting for the answer" };

function renderPackets() {
  const S = scan, s = S.s, tech = S.tech, P = S.pk || { ports: {}, disc: {}, n: 0, dropped: 0, me: "" };
  // real: nmap printed its packet trace and the page read it (Linux and macOS).
  const real = S.live && S.realOut && s.v.packetTrace;
  const canTrace = (S.live || S.saved) && env.backend && env.platform !== "win32" && !s.v.packetTrace && S.status !== "running";
  const big = traceEstimate(s) > TRACE_BIG;
  const traceBtn = !canTrace ? "" : big
    ? '<p class="pk-cap">This scan is too big for a trace you could follow (about ' + traceEstimate(s).toLocaleString("en-US") + " packets). Scan a few ports on one host, for example -p 22,80, then use Packet trace.</p>"
    : '<div class="acts"><button class="btn" id="pk-trace">Run again with --packet-trace</button></div>';
  let intro;
  if (real) intro = '<p class="pk-cap">The real packets Nmap sent and received in this scan, read from its --packet-trace output.' + (P.dropped ? " This scan sent more than " + PK_MAX + " packets; only the first " + PK_MAX + " are kept here, the Terminal tab has all of them." : "") + "</p>";
  else if (!S.live && !S.saved) intro = '<p class="pk-cap">In the real app this view is drawn from Nmap\'s --packet-trace output. Here it shows what a single port check looks like on the wire.</p>';
  else if (S.saved) intro = '<div class="cat-note"><strong>Example.</strong> Saved scans do not keep their packets yet, so this is what a check of this port looks like, worked out from its result.</div>' + traceBtn;
  else if (!S.realOut && S.status !== "running" || env.platform === "win32") intro = '<div class="cat-note"><strong>Example.</strong> On Windows, Ariadne cannot read Nmap\'s packet trace yet, so this is what a check of this port looks like, worked out from its result.</div>';
  else intro = '<div class="cat-note"><strong>Example.</strong> This is worked out from the result, not the real packets.' + (big ? "" : " Run the scan again with Packet trace (--packet-trace) to see every packet Nmap really sent and received.") + "</div>" + traceBtn;

  const h = S.hosts[S.selHost];
  const discList = real && h ? P.disc[h.ip] || [] : [];
  const discHtml = discList.length ? '<h4 class="pk-h">How Nmap found ' + esc(h.ip) + "</h4>" + pkLadder(P.me || env.localIp, h.ip, pkRows(discList)) + '<p class="pk-cap">' + esc(discCaption(discList)) + "</p>" : "";
  const wrap = (inner) => '<div class="panel packets">' + intro + inner + discHtml + "</div>";
  if (!tech) return wrap(discHtml ? "" : '<p class="muted">This scan did not probe ports' + (real ? "" : ", so there are no port checks to show") + ".</p>");
  if (!h || !h.up || !h.ports.length) return wrap('<p class="muted">Select a host with scanned ports on the Results tab.</p>');
  if (S.selPort === null || !h.ports.find((p) => p.port === S.selPort)) S.selPort = h.ports[0].port;
  const p = h.ports.find((x) => x.port === S.selPort);
  const pick = '<div class="pk-pick">Port on ' + esc(h.ip) + ": " + h.ports.map((x) => '<button data-port="' + x.port + '" aria-pressed="' + (x.port === p.port) + '">' + x.port + "</button>").join("") + "</div>";
  const ptech = p.proto === "udp" ? "sU" : tech;
  const ex = exampleSeq(p, ptech);
  const me = S.ds.local ? "127.0.0.1" : S.live ? P.me || env.localIp : SELF;
  const peer = h.ip + ":" + p.port;
  const exLadder = (times) => pkLadder(me, peer, ex.seq.map((x, i) => [x[0], x[1], times ? 0.0412 + i * (parseFloat(h.latency) + 0.0003) : null]));
  const list = real ? (P.ports[h.ip + "|" + p.proto + "|" + p.port] || []).slice() : [];
  const icmp = real ? unreachFor(S, h, p) : null;
  if (icmp) { list.push(icmp); list.sort((a, b) => a.t - b.t); }

  if (real && list.length && list[0].dir === "conn") {
    // -sT: the operating system makes the connection, so nmap only sees how it ended.
    const rows = list.map((pk) => "<li><span class=\"lt\">" + pk.t.toFixed(4) + "s</span> connect() to port " + p.port + ": " + esc(CONN_PLAIN[pk.label] || pk.label) + "</li>").join("");
    return wrap(pick + '<ol class="pk-conn">' + rows + "</ol>" +
      '<p class="pk-cap">With a TCP Connect scan (-sT) the operating system makes each connection for Nmap, so Nmap only learns how each attempt ended, not the packets themselves. A SYN scan (-sS, needs root) shows the packets.</p>' +
      '<h4 class="pk-h">On the wire (example)</h4>' + exLadder(false) + '<p class="pk-cap">' + esc(ex.cap) + "</p>" +
      '<pre class="term small">' + esc(list.map((pk) => pk.raw).join("\n")) + "</pre>");
  }
  if (real && list.length) {
    const rows = pkRows(list);
    if (rows[rows.length - 1][0] === "out" && /filtered/.test(p.state)) rows.push(["lost", "no reply", null]);
    const guessed = list.some((pk) => pk.guess);
    return wrap(pick + pkLadder(me, peer, rows) + '<p class="pk-cap">' + esc(ex.cap) + "</p>" +
      (guessed ? '<p class="pk-cap">* An ICMP error does not name the port it answers. Nmap counted it for this port, which it marked closed; Ariadne pairs such errors with the closed ports in the order they were probed.</p>' : "") +
      '<pre class="term small">' + esc(list.map((pk) => pk.raw).join("\n")) + "</pre>");
  }
  if (real) {
    return wrap(pick + '<p class="muted">The trace has no packets for this port. That happens when another step, such as version detection, checked it, or when the trace was cut short.</p>' +
      '<h4 class="pk-h">On the wire (example)</h4>' + exLadder(false) + '<p class="pk-cap">' + esc(ex.cap) + "</p>");
  }
  if (S.live || S.saved) return wrap(pick + exLadder(false) + '<p class="pk-cap">' + esc(ex.cap) + "</p>");

  // Simulated scan (no backend): also show what trace lines would look like.
  const sp = 41937; const tr = []; let t = 0.0412;
  if (tech === "sT") {
    tr.push("CONN (" + t.toFixed(4) + "s) TCP localhost > " + h.ip + ":" + p.port + " => " + (p.state === "open" ? "Connected" : p.state === "closed" ? "Connection refused" : "Operation now in progress"));
    tr.push("# With -sT, Nmap uses the system connect() call and cannot see the raw packets. The diagram above shows what happens on the wire.");
  } else {
    ex.seq.forEach((pair) => {
      const dir = pair[0], label = pair[1], proto = ptech === "sU" ? "UDP" : "TCP";
      if (dir === "out") tr.push("SENT (" + t.toFixed(4) + "s) " + proto + " " + me + ":" + sp + " > " + h.ip + ":" + p.port + " " + (ptech === "sU" ? "ttl=58 id=" + (40000 + p.port % 999) + " iplen=28" : (label.startsWith("RST") ? "R" : "S") + " ttl=" + (label.startsWith("RST") ? 64 : 44) + " id=" + (20000 + p.port % 997) + " iplen=" + (label.startsWith("RST") ? 40 : 44) + " seq=2903119851 win=" + (label.startsWith("RST") ? 0 : 1024)));
      else if (dir.startsWith("in")) tr.push("RCVD (" + t.toFixed(4) + "s) " + (label.startsWith("ICMP") ? "ICMP [" + h.ip + " > " + me + " Port unreachable (type=3/code=3)]" : proto + " " + h.ip + ":" + p.port + " > " + me + ":" + sp + " " + (label === "SYN/ACK" ? "SA ttl=50 id=0 iplen=44" : label === "UDP reply" ? "ttl=50 id=0 iplen=76" : "RA ttl=50 id=0 iplen=40 win=0")));
      t += dir === "lost" ? 1.0 : parseFloat(h.latency) + 0.0003;
    });
  }
  return wrap(pick + exLadder(true) + '<p class="pk-cap">' + esc(ex.cap) + '</p><pre class="term small">' + esc(tr.join("\n")) + "</pre>");
}

/* ---------- History (saved by app.py) ---------- */
function recMeta(r) {
  const bits = [String(r.started || "").slice(0, 16), r.hosts_up + " host" + (r.hosts_up !== 1 ? "s" : "") + " up", r.open_ports + " open port" + (r.open_ports !== 1 ? "s" : "")];
  if (r.status !== "done") bits.push(r.status);
  return bits.join(" - ");
}
async function apiJson(path, opts) {
  const r = await api(path, opts);
  let j = null;
  try { j = await r.json(); } catch (err) { /* not JSON */ }
  if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
  return j;
}
async function loadHistory() {
  if (!env.backend) return;
  try { hist.list = await apiJson("/api/history"); hist.error = ""; }
  catch (err) { hist.error = "Could not load the saved scans: " + err.message; }
  hist.sel = hist.sel.filter((id) => (hist.list || []).some((r) => r.id === id));
  if (ui.screen === "history") renderHistory(); else if (ui.screen === "start") renderStart();
}
async function openSaved(id) {
  if (scan && scan.status === "running") {
    if (!confirm("A scan is still running. Stop it and open the saved scan?")) return;
    if (scan.live) stopLive();
    scan.status = "stopped";
  }
  let rec;
  try { rec = await apiJson("/api/history/" + encodeURIComponent(id)); }
  catch (err) { alert("Could not open the saved scan: " + err.message); return; }
  // Load its options into the builder too, so Edit command and Run again start from them.
  parseCommand(["nmap"].concat((rec.args || []).map((a) => (/\s/.test(a) ? '"' + a + '"' : a))).join(" "));
  const S = scanFor(JSON.parse(JSON.stringify(state)), true);
  scanToken++;
  scan = S;
  S.saved = true; S.savedId = rec.id; S.savedAt = String(rec.started || "").slice(0, 16);
  S.status = rec.status === "done" ? "done" : "stopped";
  if (rec.status === "error") S.error = "Nmap reported an error when this scan ran (exit code " + rec.exit_code + ").";
  S.progress = 1; S.sim = parseFloat(rec.elapsed) || 0;
  if (S.status === "done") S.phases.forEach((p) => { p.state = "done"; });
  S.hosts = (rec.hosts || []).map((b) => uiHost(b, S)).filter((h) => h.up);
  termLine("# Saved scan from " + rec.started, "d");
  termLine("$ " + S.displayCmd, "c");
  S.hosts.forEach((h) => liveReport(h, S));
  termLine("");
  termLine(rec.summary || "Scan " + rec.status, "c");
  S.tab = "results";
  ui.screen = "scan";
  renderAll();
}
async function download(id, kind) {
  try {
    const r = await api("/api/history/" + encodeURIComponent(id) + "/" + kind);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = (kind === "xml" ? "nmap-" : "nmap-report-") + id + (kind === "xml" ? ".xml" : ".html");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) { alert("Could not download the " + (kind === "xml" ? "XML" : "report") + ": " + err.message); }
}
async function deleteSaved(id) {
  if (!confirm("Delete this saved scan? Its XML and report go too. This cannot be undone.")) return;
  try { await apiJson("/api/history/" + encodeURIComponent(id), { method: "DELETE" }); }
  catch (err) { hist.error = "Could not delete the scan: " + err.message; }
  hist.sel = hist.sel.filter((x) => x !== id);
  if (hist.diff && (hist.diff.old.id === id || hist.diff.new.id === id)) hist.diff = null;
  if (scan && scan.savedId === id) scan.savedId = null;
  loadHistory();
}
async function compareSelected() {
  if (hist.sel.length !== 2) return;
  hist.diff = null; hist.diffErr = "";
  try { hist.diff = await apiJson("/api/diff?a=" + encodeURIComponent(hist.sel[0]) + "&b=" + encodeURIComponent(hist.sel[1])); }
  catch (err) { hist.diffErr = "Could not compare the scans: " + err.message; }
  renderHistory();
  const el = $("#s-history .diff, #s-history .diffwarn"); if (el) el.scrollIntoView({ block: "nearest" });
}
function renderHistory() {
  const root = $("#s-history");
  if (!env.backend) { root.innerHTML = '<div class="panel empty"><h2>History needs the backend</h2><p>Saved scans live on your machine. Start the app with python3 app.py and open http://127.0.0.1:8732 to see them here.</p></div>'; return; }
  if (!hist.list) { root.innerHTML = '<div class="panel empty"><h2>' + (hist.error ? "History unavailable" : "Loading saved scans") + "</h2><p>" + esc(hist.error || "One moment...") + "</p></div>"; return; }
  if (!hist.list.length) { root.innerHTML = '<div class="panel empty"><h2>No saved scans yet</h2><p>Every scan you run is saved here automatically, so you can open it later, download a report or compare it with a newer scan.</p><button class="btn primary" data-go="build">Build a scan</button></div>'; return; }
  const n = hist.sel.length;
  const head = '<div class="panel histhead"><div><h2>Saved scans</h2><p class="plain">Tick two scans of the same target and press Compare to see what changed.' + (env.dataDir ? " Stored in <code>" + esc(env.dataDir) + "</code>" : "") + '</p></div><div class="hacts"><button class="btn primary" id="hist-compare"' + (n === 2 ? "" : " disabled") + ">Compare (" + n + "/2)</button>" + (n ? '<button class="btn" id="hist-clear">Clear selection</button>' : "") + "</div></div>";
  const rows = hist.list.map((r) => {
    const on = hist.sel.includes(r.id), id = esc(r.id);
    return "<tr" + (on ? ' class="sel"' : "") + '><td><input type="checkbox" data-histsel="' + id + '"' + (on ? " checked" : "") + ' aria-label="Select for comparison"></td>' +
      '<td class="addr">' + esc(String(r.started || "").slice(0, 16)) + "</td>" +
      '<td><code class="hcmd">' + esc(r.command || "") + "</code></td>" +
      "<td>" + r.hosts_up + " up, " + r.open_ports + " open" + (r.status !== "done" ? ' <span class="st filtered">' + esc(r.status) + "</span>" : "") + "</td>" +
      '<td><div class="hacts"><button class="ghost" data-openscan="' + id + '">Open</button><button class="ghost" data-dl="report" data-scan="' + id + '">Report</button><button class="ghost" data-dl="xml" data-scan="' + id + '">XML</button><button class="ghost danger" data-delscan="' + id + '">Delete</button></div></td></tr>';
  }).join("");
  const table = '<div class="panel"><div class="tablewrap"><table class="grid static"><thead><tr><th><span class="sr">Compare</span></th><th>When</th><th>Command</th><th>Result</th><th>Actions</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>";
  root.innerHTML = head + (hist.error ? '<p class="cat-note warn">' + esc(hist.error) + "</p>" : "") + table + renderDiff();
}
const CHANGE_LABEL = { opened: "Now open", closed: "No longer open", state: "State changed", service: "Different service or version", listed: "Newly listed", unlisted: "No longer listed" };
function portSide(x) { return x ? '<span class="st ' + stClass(x.state) + '">' + esc(x.state) + "</span> " + esc(x.service) : '<span class="muted">not listed</span>'; }
function renderDiff() {
  if (hist.diffErr) return '<p class="cat-note warn diffwarn">' + esc(hist.diffErr) + "</p>";
  const d = hist.diff;
  if (!d) return "";
  const c = d.counts, plural = (k, one) => c[k] + " " + one + (c[k] !== 1 ? "s" : "");
  const bits = [];
  if (c.opened) bits.push(plural("opened", "port") + " opened");
  if (c.closed) bits.push(plural("closed", "port") + " no longer open");
  if (c.changed) bits.push(plural("changed", "other port change"));
  if (c.new_hosts) bits.push(plural("new_hosts", "new host"));
  if (c.gone_hosts) bits.push(plural("gone_hosts", "host") + " no longer answering");
  let out = '<div class="panel diff"><div><div class="eyebrow">Comparison</div><h2>' + esc(String(d.old.started || "").slice(0, 16)) + " &rarr; " + esc(String(d.new.started || "").slice(0, 16)) + '</h2><p class="plain">' + esc(bits.length ? bits.join(", ") + "." : "Nothing changed between these two scans.") + "</p></div>";
  if (!d.same_options) out += '<p class="cat-note warn">These scans used different options (<code>' + esc(d.old.command) + "</code> and <code>" + esc(d.new.command) + "</code>), so some differences may come from the options rather than from the hosts.</p>";
  if (d.hosts.length) out += '<p class="src">A port Nmap did not list was closed, filtered or not scanned in that run, so it shows as "not listed".</p>';
  d.hosts.forEach((h) => {
    out += '<div class="dhost"><h3>' + esc(h.addr) + (h.name ? ' <span class="muted">' + esc(h.name) + "</span>" : "") + (h.change === "new" ? ' <span class="badge quiet">New host</span>' : h.change === "gone" ? ' <span class="badge loud">No longer answers</span>' : "") + "</h3>";
    if (h.ports.length) out += '<div class="tablewrap"><table class="grid static"><thead><tr><th>Port</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>' +
      h.ports.map((p) => '<tr><td class="addr">' + p.port + "/" + esc(p.protocol) + "</td><td>" + portSide(p.before) + "</td><td>" + portSide(p.after) + '</td><td><span class="chg ' + esc(p.change) + '">' + esc(CHANGE_LABEL[p.change] || p.change) + "</span></td></tr>").join("") + "</tbody></table></div>";
    out += "</div>";
  });
  return out + "</div>";
}

applyTheme();
renderAll();
detectBackend();
})();
</script>
