<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ariadne - A friendly guide to Nmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: desktop app shell. Status bar, screen tabs, then the active screen.
   Build = search+categories | options (level-gated) | explanation, over a docked command bar.
   Scripts = filters | script list | detail. Scan = progress + tabbed views. Everything stacks on phones. */
:root {
  --bg: #EDF0F4; --panel: #FFFFFF; --panel-2: #F5F7FA; --line: #D6DCE5;
  --ink: #18202D; --ink-2: #4B5567; --ink-3: #7A8597;
  --accent: #2352C4; --accent-ink: #FFFFFF; --accent-soft: #E2E9FA;
  --ok: #1E7F48; --ok-soft: #DFF2E6; --warn: #9A6200; --warn-soft: #FAEFD7;
  --bad: #B83434; --bad-soft: #FAE3E3; --root: #6542B8; --root-soft: #ECE5FA;
  --term-bg: #121924; --term-ink: #CBD5E3; --term-dim: #6E7E94; --term-accent: #92B4FF;
  --term-target: #F2C879; --term-ok: #7BD8A0; --term-warn: #E8B562; --term-bad: #F08A8A;
  --chip-bg: #1C2534; --chip-line: #2C384B;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans", "DejaVu Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, "Liberation Mono", monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1219; --panel: #161C26; --panel-2: #1B2230; --line: #2A3343;
    --ink: #E3E8F0; --ink-2: #A8B3C3; --ink-3: #7B879A;
    --accent: #7FA1FF; --accent-ink: #0E1219; --accent-soft: #1F2A45;
    --ok: #55C487; --ok-soft: #13301F; --warn: #E2A93E; --warn-soft: #33270F;
    --bad: #F07474; --bad-soft: #3A1B1D; --root: #B59EF6; --root-soft: #281F41;
    --term-bg: #0A0E14; --chip-bg: #151D2A; --chip-line: #283346;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1219; --panel: #161C26; --panel-2: #1B2230; --line: #2A3343;
  --ink: #E3E8F0; --ink-2: #A8B3C3; --ink-3: #7B879A;
  --accent: #7FA1FF; --accent-ink: #0E1219; --accent-soft: #1F2A45;
  --ok: #55C487; --ok-soft: #13301F; --warn: #E2A93E; --warn-soft: #33270F;
  --bad: #F07474; --bad-soft: #3A1B1D; --root: #B59EF6; --root-soft: #281F41;
  --term-bg: #0A0E14; --chip-bg: #151D2A; --chip-line: #283346;
  color-scheme: dark;
}
/* Base reset. When this page is published as an Artifact, claude.ai wraps it in
   a skeleton that already provides these; when it is served by app.py or opened
   as a local file there is no skeleton, so we include them here too. Without the
   [hidden] rule the inactive screens would all stay visible and overlap. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
table { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { min-height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: .01em; }
.brand-tag { font-size: 13px; color: var(--ink-3); }
@media (max-width: 640px) { .brand-tag { display: none; } }
.brand-ver { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12px; color: var(--ink-2); font-family: var(--font-mono); white-space: nowrap; }
button.pill { cursor: pointer; }
button.pill:hover { border-color: var(--ink-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); } .dot.root { background: var(--root); }
.pill.sim { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.ghost:hover { border-color: var(--ink-3); color: var(--ink); }

.targetbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.targetbar label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.targetbar input { flex: 0 1 340px; min-width: 0; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink); font-family: var(--font-mono); font-size: 13px; }
.targetbar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.tb-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.tb-quick { display: flex; flex-wrap: wrap; gap: 6px; }
.tb-quick button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); font-family: var(--font-mono); }
.tb-quick button:hover { color: var(--accent); border-color: var(--accent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .tstate { font-size: 11px; font-family: var(--font-mono); padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tab .tstate.done { background: var(--ok-soft); color: var(--ok); }

.screen { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.muted { color: var(--ink-3); }

/* Start */
.start { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.start-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hello h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.15; }
.hello p { color: var(--ink-2); margin-top: 6px; max-width: 62ch; }
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.task { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.task:hover { border-color: var(--accent); }
.task h3 { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.task p { color: var(--ink-2); }
.task code { display: block; margin-top: auto; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); padding: 6px 8px; border-radius: 5px; color: var(--ink); overflow-wrap: anywhere; }
.task .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.scratch { align-self: flex-start; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
.scratch:hover { text-decoration: underline; }
.side { display: flex; flex-direction: column; gap: 12px; }
.box { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.box h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.src { font-size: 11.5px; color: var(--ink-3); font-family: var(--font-mono); }
.recent { display: flex; flex-direction: column; }
.recent button { text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 0; cursor: pointer; display: grid; gap: 2px; }
.recent button:hover .r-target { color: var(--accent); }
.r-target { font-family: var(--font-mono); font-size: 12.5px; } .r-meta { font-size: 12px; color: var(--ink-3); }
.legal { font-size: 12.5px; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 4px 0 4px 10px; }
.tools-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tools-row button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; font-family: var(--font-mono); }
.tools-row button:hover { border-color: var(--accent); color: var(--accent); }

/* Builder */
.builder { display: grid; grid-template-columns: 230px minmax(0, 1fr) 330px; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; }
.builder.expert { grid-template-columns: 230px minmax(0, 1fr); }
.builder.expert .explain { display: none; }
.navcol { display: flex; flex-direction: column; min-height: 0; }
.search { padding: 8px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); font-family: var(--font-mono); font-size: 12.5px; }
.search input:focus { border-color: var(--accent); outline: none; }
.cats { padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.cat { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.cat:hover { background: var(--panel-2); color: var(--ink); }
.cat[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.cat.adv { color: var(--ink-3); }
.cat .n { font-family: var(--font-mono); font-size: 11px; min-width: 20px; text-align: center; padding: 0 5px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); }
.options { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cat-head h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.cat-head p { color: var(--ink-2); margin-top: 2px; }
.cat-note { font-size: 12.5px; padding: 8px 10px; border-radius: 6px; margin-top: 8px; }
.cat-note.warn { background: var(--warn-soft); color: var(--warn); }
.cat-note.root { background: var(--root-soft); color: var(--root); }
.group { display: flex; flex-direction: column; gap: 2px; }
.group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; padding: 6px 12px 4px; }
.opt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 0 10px; padding: 9px 12px; border-radius: 6px; border: 1px solid transparent; }
.opt:hover, .opt.focus { background: var(--panel-2); }
.opt.focus { border-color: var(--line); }
.opt.dep { margin-left: 22px; }
.opt.off { opacity: .5; }
.opt input[type="radio"], .opt input[type="checkbox"] { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.opt .nocheck { grid-column: 1; }
.opt-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; grid-column: 2; }
.opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; cursor: pointer; }
.opt-title { font-weight: 500; }
.flag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.plain { color: var(--ink-2); font-size: 13px; }
.badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.badge.root { color: var(--root); background: var(--root-soft); }
.badge.slow { color: var(--warn); background: var(--warn-soft); }
.badge.loud { color: var(--bad); background: var(--bad-soft); }
.badge.quiet { color: var(--ok); background: var(--ok-soft); }
.badge.lvl { color: var(--ink-3); background: var(--panel-2); border: 1px solid var(--line); }
.badge.done { color: var(--ok); background: var(--ok-soft); }
.badge.todo { color: var(--warn); background: var(--warn-soft); }
.badge.opt { color: var(--ink-3); background: var(--panel-2); border: 1px solid var(--line); }

/* First-run guide */
.guide { padding: 16px; display: flex; flex-direction: column; gap: 14px; border-color: var(--accent); }
.guide h2 { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; }
.step-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1.5px solid var(--line); color: var(--ink-2); }
.step.done .step-n { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.step.todo .step-n { border-color: var(--warn); color: var(--warn); }
.step-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step-body h3 { font-size: 14.5px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.step-body p { color: var(--ink-2); font-size: 13px; }
.cmdline { display: flex; align-items: stretch; gap: 6px; }
.cmdline pre { flex: 1; min-width: 0; margin: 0; background: var(--term-bg); color: var(--term-ink); padding: 7px 10px; border-radius: 5px; font-size: 12.5px; overflow-x: auto; }
.cmdline button { flex: none; }
.step-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.guide-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.inlinein { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }
.text { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-family: var(--font-mono); font-size: 12.5px; min-width: 0; }
.text:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.text.full { width: 100%; } .text.mid { width: 200px; max-width: 100%; } .text.small { width: 110px; }
select.text { padding: 6px 8px; cursor: pointer; }
.unit { font-size: 12px; color: var(--ink-3); }
.showmore { border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; margin-top: 2px; }
.showmore:hover { border-color: var(--accent); color: var(--accent); }
.scriptpick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.scriptpick .stag { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 4px 1px 7px; font-family: var(--font-mono); font-size: 12px; }
.scriptpick .stag button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 3px; }
.openbrowse { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 500; padding: 0; }
.openbrowse:hover { text-decoration: underline; }

.explain { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.ex-flag { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--accent); overflow-wrap: anywhere; }
.ex-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.ex-summary { color: var(--ink); font-size: 14.5px; }
.ex-sec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 4px; }
.ex-sec p { color: var(--ink-2); max-width: 65ch; }
.ex-eg { font-family: var(--font-mono); font-size: 12px; background: var(--term-bg); color: var(--term-ink); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.fact strong { font-size: 13px; font-weight: 500; } .fact strong.root { color: var(--root); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 12px; height: 8px; border-radius: 2px; background: var(--line); display: block; }
.meter i.on { background: var(--ok); }
.meter.m3 i.on { background: var(--warn); } .meter.m4 i.on, .meter.m5 i.on { background: var(--bad); }
.ex-ref { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 10px; }

/* Command bar */
.cmdbar { grid-column: 1 / -1; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cmd-row { display: flex; gap: 10px; align-items: stretch; }
.cmdline { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 13px; background: var(--term-bg); color: var(--term-ink); padding: 9px 12px; border-radius: 6px; min-height: 44px; }
.cmdline .prompt { color: var(--term-dim); } .cmdline .bin { color: var(--term-ink); font-weight: 700; margin-right: 2px; }
.chip { display: inline-flex; align-items: stretch; border: 1px solid var(--chip-line); background: var(--chip-bg); border-radius: 4px; overflow: hidden; }
.chip button { border: 0; background: none; color: var(--term-accent); cursor: pointer; font-family: var(--font-mono); font-size: 13px; padding: 1px 7px; }
.chip button.x { color: var(--term-dim); padding: 1px 6px; border-left: 1px solid var(--chip-line); }
.chip button.x:hover { color: var(--term-bad); } .chip button.main:hover { background: var(--chip-line); }
.chip.target button.main { color: var(--term-target); }
.chip.locked { border-color: var(--term-bad); } .chip.current { border-color: var(--term-accent); }
.chip.managed button.main { color: var(--term-dim); } .chip.managed { border-style: dashed; }
.cmd-edit { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-accent); border-radius: 6px; padding: 9px 12px; }
.cmd-tools { display: flex; flex-direction: column; gap: 6px; }
.cmd-tools .ghost { padding: 5px 10px; white-space: nowrap; }
.below { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.metric strong { font-weight: 500; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.run-wrap { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn.run { padding: 9px 22px; font-size: 14.5px; }

<script>
(function () {
"use strict";

/* ---------- Script risk ---------- */
const RISK_CAT = { safe: "safe", auth: "safe", default: "safe", discovery: "safe", version: "safe", info: "safe", broadcast: "safe",
  intrusive: "mid", external: "mid", fuzzer: "mid", brute: "danger", dos: "danger", exploit: "danger", malware: "danger", vuln: "mid" };
const CAT_ORDER = ["default", "safe", "discovery", "version", "auth", "broadcast", "vuln", "intrusive", "external", "fuzzer", "brute", "exploit", "dos", "malware"];
function scriptRisk(s) {
  if (s.c.some((c) => RISK_CAT[c] === "danger")) return "danger";
  if (s.c.some((c) => RISK_CAT[c] === "mid")) return "mid";
  return "safe";
}
const RISK_LABEL = { safe: "Generally safe", mid: "Intrusive", danger: "Dangerous" };
NSE.forEach((s) => { s.risk = scriptRisk(s); });
const NSE_BY_NAME = {}; NSE.forEach((s) => { NSE_BY_NAME[s.n] = s; });

/* ---------- Catalog ----------
   Each option: k key, cat, flag, title, summary, detail, when, eg example, ref man section,
   lvl 1=essential 2=common 3=advanced, noise 0-5, root, slow, quiet,
   ctl: bool | radio(field,val) | val(kind,ph,unit) | select(opts), dep (parent key), grp subsection, managed, info */
const CATS = [
  { id: "target", name: "Target", blurb: "What you are going to scan." },
  { id: "discovery", name: "Host discovery", blurb: "How Nmap decides which hosts are online before scanning ports." },
  { id: "technique", name: "Scan techniques", blurb: "How Nmap knocks on each port." },
  { id: "ports", name: "Ports", blurb: "Which ports to check and in what order." },
  { id: "detection", name: "Service / version", blurb: "Identify the software behind each open port." },
  { id: "scripts", name: "Scripts (NSE)", blurb: "Run Lua scripts for extra detail, vulnerability checks and more." },
  { id: "os", name: "OS detection", blurb: "Guess the operating system of each host." },
  { id: "timing", name: "Timing & performance", blurb: "Speed versus stealth, accuracy and load." },
  { id: "evasion", name: "Firewall / IDS evasion", blurb: "Change how packets look to get past filters. Advanced and easy to misuse.", adv: true },
  { id: "output", name: "Output", blurb: "How much detail you see and what gets saved." },
  { id: "misc", name: "Misc", blurb: "IPv6, aggressive mode and low-level sending options.", adv: true }
];

const ALLOPTS = [];
function def(o) { ALLOPTS.push(o); }

/* TARGET */
def({ k: "target", cat: "target", flag: "<target>", title: "Target", lvl: 1, noise: 0, ctl: "field", kind: "target", ref: "TARGET SPECIFICATION",
  summary: "The host, IP or range Nmap will scan.",
  detail: "A hostname (scanme.nmap.org), an IP (192.168.1.10), a CIDR range (192.168.1.0/24 = 256 addresses) or a dash range (192.168.1.1-20). Separate several with spaces.",
  when: "Always. Scan only machines you own or may test.", eg: "nmap scanme.nmap.org" });
def({ k: "iL", cat: "target", flag: "-iL", title: "Targets from a file", lvl: 2, noise: 0, ctl: "val", kind: "file", ph: "hosts.txt", ref: "TARGET SPECIFICATION",
  summary: "Read the list of targets from a text file, one per line.",
  detail: "Each line can be a host, an IP, a range or a CIDR block. Useful when you keep an inventory of machines.", when: "You scan the same list often.", eg: "nmap -iL hosts.txt" });
def({ k: "iR", cat: "target", flag: "-iR", title: "Random targets", lvl: 3, noise: 2, ctl: "val", kind: "num", ph: "100", ref: "TARGET SPECIFICATION",
  summary: "Pick this many random public IP addresses.",
  detail: "Nmap generates random Internet addresses. This is for research on the Internet as a whole and should not be pointed at machines you do not control.", when: "Large-scale research only.", eg: "nmap -iR 100 -sn" });
def({ k: "exclude", cat: "target", flag: "--exclude", title: "Exclude hosts", lvl: 2, noise: 0, ctl: "val", kind: "list", ph: "192.168.1.1,192.168.1.73", ref: "TARGET SPECIFICATION",
  summary: "Skip specific addresses inside your range.",
  detail: "Leave out the router, your own machine or a fragile device. Comma-separated.", when: "A range contains machines you should not touch.", eg: "nmap 192.168.1.0/24 --exclude 192.168.1.1" });
def({ k: "excludefile", cat: "target", flag: "--excludefile", title: "Exclude from file", lvl: 3, noise: 0, ctl: "val", kind: "file", ph: "skip.txt", ref: "TARGET SPECIFICATION",
  summary: "Read the list of addresses to skip from a file.", detail: "Like --exclude, but from a file with one entry per line.", when: "You keep a standing do-not-scan list.", eg: "nmap 10.0.0.0/24 --excludefile skip.txt" });

/* HOST DISCOVERY */
def({ k: "disc", cat: "discovery", flag: "", title: "Standard discovery", lvl: 1, noise: 1, ctl: "radio", field: "disc", val: "default", grp: "What to do", ref: "HOST DISCOVERY",
  summary: "Check which hosts are online, then scan only those.",
  detail: "On a local network as root Nmap uses ARP. Otherwise it mixes an ICMP echo, a TCP SYN to 443, a TCP ACK to 80 and an ICMP timestamp. As a normal user it tries TCP connections to 80 and 443.",
  when: "Most scans. This is the default.", eg: "nmap 192.168.1.0/24" });
def({ k: "disc", cat: "discovery", flag: "-sL", title: "List scan", lvl: 2, noise: 0, quiet: true, ctl: "radio", field: "disc", val: "sL", grp: "What to do", ref: "HOST DISCOVERY",
  summary: "Only list the targets, without sending scan packets.",
  detail: "Nmap prints every address the target expands to and does a reverse DNS lookup on each. No ports are probed, so it is a safe way to preview what a range covers.", when: "You want to check a range before scanning it.", eg: "nmap -sL 192.168.1.0/24" });
def({ k: "disc", cat: "discovery", flag: "-sn", title: "Ping scan (no ports)", lvl: 1, noise: 1, quiet: true, ctl: "radio", field: "disc", val: "sn", grp: "What to do", ref: "HOST DISCOVERY",
  summary: "Find which hosts are online, without scanning any ports.",
  detail: "Runs discovery and stops. Fast and quiet, the usual first step on a network you do not know.", when: "You want an inventory of live devices.", eg: "nmap -sn 192.168.1.0/24" });
def({ k: "disc", cat: "discovery", flag: "-Pn", title: "Skip discovery", lvl: 2, noise: 2, slow: true, ctl: "radio", field: "disc", val: "Pn", grp: "What to do", ref: "HOST DISCOVERY",
  summary: "Assume every address is online and port scan it anyway.",
  detail: "Some hosts block ping and look down. -Pn forces a port scan on every target. On a range with many empty addresses it becomes very slow.", when: "A host you know is up shows as down.", eg: "nmap -Pn 192.168.1.10" });
def({ k: "PS", cat: "discovery", flag: "-PS", title: "TCP SYN ping", lvl: 2, noise: 1, root: true, ctl: "val", kind: "ports", ph: "80,443", opt: true, grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send a TCP SYN to the given ports to check if a host is up.",
  detail: "A SYN/ACK or RST both prove the host exists. Default port is 80. Add a port list right after, e.g. -PS22,80,443.", when: "ICMP ping is blocked but some TCP port replies.", eg: "nmap -PS22,80,443 10.0.0.0/24" });
def({ k: "PA", cat: "discovery", flag: "-PA", title: "TCP ACK ping", lvl: 3, noise: 1, root: true, ctl: "val", kind: "ports", ph: "80", opt: true, grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send a TCP ACK to probe hosts behind simple firewalls.", detail: "A stray ACK often draws an RST from a live host, which proves it is up. Default port 80.", when: "A firewall drops SYN pings.", eg: "nmap -PA80 10.0.0.0/24" });
def({ k: "PU", cat: "discovery", flag: "-PU", title: "UDP ping", lvl: 3, noise: 1, root: true, ctl: "val", kind: "ports", ph: "40125", opt: true, grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send a UDP packet to probe for live hosts.", detail: "A closed UDP port replies with an ICMP unreachable, which proves the host is up. Good against firewalls that only filter TCP.", when: "TCP pings are filtered.", eg: "nmap -PU53 10.0.0.0/24" });
def({ k: "PY", cat: "discovery", flag: "-PY", title: "SCTP ping", lvl: 3, noise: 1, root: true, ctl: "val", kind: "ports", ph: "80", opt: true, grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send an SCTP INIT chunk to probe for live hosts.", detail: "SCTP is used by some telecom and signalling systems. Rarely needed on ordinary networks.", when: "Scanning SCTP-capable hosts.", eg: "nmap -PY 10.0.0.0/24" });
def({ k: "PE", cat: "discovery", flag: "-PE", title: "ICMP echo ping", lvl: 2, noise: 1, root: true, ctl: "bool", grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send a classic ICMP echo request (a normal ping).", detail: "The familiar ping. Many hosts and firewalls block it, which is why Nmap also uses other probes by default.", when: "Local networks where ping is allowed.", eg: "nmap -PE 192.168.1.0/24" });
def({ k: "PP", cat: "discovery", flag: "-PP", title: "ICMP timestamp ping", lvl: 3, noise: 1, root: true, ctl: "bool", grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send an ICMP timestamp request.", detail: "Some hosts block echo but answer timestamp requests, so this can find them.", when: "Echo ping is blocked.", eg: "nmap -PP 192.168.1.0/24" });
def({ k: "PM", cat: "discovery", flag: "-PM", title: "ICMP netmask ping", lvl: 3, noise: 1, root: true, ctl: "bool", grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send an ICMP address mask request.", detail: "An old probe that a few hosts still answer. Rarely useful today.", when: "Legacy devices.", eg: "nmap -PM 192.168.1.0/24" });
def({ k: "PO", cat: "discovery", flag: "-PO", title: "IP protocol ping", lvl: 3, noise: 1, root: true, ctl: "val", kind: "list", ph: "1,2,4", opt: true, grp: "Probe types (combine freely)", ref: "HOST DISCOVERY",
  summary: "Send raw IP packets with the given protocol numbers.", detail: "Probes with protocols such as ICMP (1), IGMP (2) or IP-in-IP (4). A reply proves the host is up.", when: "Unusual networks.", eg: "nmap -PO1,2,4 10.0.0.0/24" });
def({ k: "dns", cat: "discovery", flag: "", title: "Resolve names sometimes", lvl: 2, noise: 0, ctl: "radio", field: "dns", val: "default", grp: "DNS resolution", ref: "HOST DISCOVERY",
  summary: "Look up names only for hosts that are online (the default).", detail: "Nmap asks DNS for the name of each live host, which is the normal balance between speed and detail.", when: "Most scans.", eg: "nmap scanme.nmap.org" });
def({ k: "dns", cat: "discovery", flag: "-n", title: "Never resolve DNS", lvl: 2, noise: 0, quiet: true, ctl: "radio", field: "dns", val: "n", grp: "DNS resolution", ref: "HOST DISCOVERY",
  summary: "Skip all DNS lookups.", detail: "Faster and sends nothing to the DNS server. Results show IP addresses only.", when: "Large ranges, or when names do not matter.", eg: "nmap -n 192.168.1.0/24" });
def({ k: "dns", cat: "discovery", flag: "-R", title: "Always resolve DNS", lvl: 3, noise: 0, ctl: "radio", field: "dns", val: "R", grp: "DNS resolution", ref: "HOST DISCOVERY",
  summary: "Look up names even for hosts that appear offline.", detail: "The opposite of -n. Useful when you want every name regardless of host state.", when: "You need names for every address.", eg: "nmap -R -sL 192.168.1.0/24" });
def({ k: "dnsServers", cat: "discovery", flag: "--dns-servers", title: "Custom DNS servers", lvl: 3, noise: 0, ctl: "val", kind: "list", ph: "8.8.8.8,1.1.1.1", ref: "HOST DISCOVERY",
  summary: "Use specific DNS servers to look up host names.", detail: "Comma-separated. Nmap uses them for its reverse lookups (address to name). Names you type as targets are still resolved by your system's normal DNS.", when: "You want names from a particular DNS server, such as your router.", eg: "nmap --dns-servers 192.168.1.1 192.168.1.0/24" });
def({ k: "systemDns", cat: "discovery", flag: "--system-dns", title: "Use system resolver", lvl: 3, noise: 0, ctl: "bool", ref: "HOST DISCOVERY",
  summary: "Resolve names through the operating system instead of Nmap's own resolver.", detail: "Slower but respects everything in your system's DNS configuration.", when: "Nmap's parallel resolver misbehaves.", eg: "nmap --system-dns scanme.nmap.org" });
def({ k: "traceroute", cat: "discovery", flag: "--traceroute", title: "Trace the route", lvl: 2, noise: 1, root: true, ctl: "bool", grp: "Extras", ref: "HOST DISCOVERY",
  summary: "Show the routers between you and each host.", detail: "After the scan Nmap sends probes with increasing TTL to map each hop. It reuses scan data, so it is faster than the traceroute command.", when: "You want to see the network path.", eg: "nmap --traceroute scanme.nmap.org" });

/* SCAN TECHNIQUES */
def({ k: "tcp", cat: "technique", flag: "", title: "Let Nmap choose", lvl: 1, noise: 2, ctl: "radio", field: "tcp", val: "default", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "SYN scan with root, Connect scan without it.",
  detail: "With raw packet access Nmap runs -sS; otherwise it falls back to -sT. The result is the same, only the method differs.", when: "You are not sure.", eg: "nmap scanme.nmap.org" });
def({ k: "tcp", cat: "technique", flag: "-sS", title: "TCP SYN scan", lvl: 1, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sS", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Send only the first handshake packet and never finish it.",
  detail: "SYN/ACK means open, RST means closed, no reply means filtered. Nmap sends RST instead of completing the connection, so it is also called half-open. Fast and the most common scan.", when: "Almost always, with root.", eg: "nmap -sS scanme.nmap.org" });
def({ k: "tcp", cat: "technique", flag: "-sT", title: "TCP Connect scan", lvl: 1, noise: 3, ctl: "radio", field: "tcp", val: "sT", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Complete the full TCP handshake with each port.",
  detail: "Nmap asks the OS to open a normal connection, like a browser. Works without root, but the target is more likely to log it.", when: "You do not have root.", eg: "nmap -sT scanme.nmap.org" });
def({ k: "tcp", cat: "technique", flag: "-sA", title: "TCP ACK scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sA", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Map firewall rules rather than find open ports.",
  detail: "It cannot tell open from closed. It tells filtered (no reply) from unfiltered (an RST comes back), which reveals what a firewall blocks.", when: "Studying a firewall's rules.", eg: "nmap -sA 10.0.0.1" });
def({ k: "tcp", cat: "technique", flag: "-sW", title: "TCP Window scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sW", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Like the ACK scan, but reads the TCP window to guess open ports.", detail: "On a few systems the RST window size differs for open ports. Unreliable across modern systems.", when: "Rare firewall analysis.", eg: "nmap -sW 10.0.0.1" });
def({ k: "tcp", cat: "technique", flag: "-sM", title: "TCP Maimon scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sM", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "A FIN/ACK probe that some older BSD systems mishandle.", detail: "Named after Uriel Maimon. Works only against certain old network stacks.", when: "Legacy BSD targets.", eg: "nmap -sM 10.0.0.1" });
def({ k: "tcp", cat: "technique", flag: "-sN", title: "TCP Null scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sN", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Send a packet with no TCP flags set.", detail: "Open or filtered ports stay silent; closed ones send RST. Can slip past simple rule sets, but Windows answers RST to everything, so it fails there.", when: "Stealth against non-Windows hosts.", eg: "nmap -sN 10.0.0.1" });
def({ k: "tcp", cat: "technique", flag: "-sF", title: "TCP FIN scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sF", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Send a lone FIN packet.", detail: "Like the Null scan: silence means open or filtered, RST means closed. Same Windows limitation.", when: "Stealth against non-Windows hosts.", eg: "nmap -sF 10.0.0.1" });
def({ k: "tcp", cat: "technique", flag: "-sX", title: "TCP Xmas scan", lvl: 3, noise: 2, root: true, ctl: "radio", field: "tcp", val: "sX", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Set the FIN, PSH and URG flags, so the packet is \"lit up like a Christmas tree\".", detail: "Behaves like the Null and FIN scans. Same Windows limitation.", when: "Stealth against non-Windows hosts.", eg: "nmap -sX 10.0.0.1" });
def({ k: "scanflags", cat: "technique", flag: "--scanflags", title: "Custom TCP flags", lvl: 3, noise: 2, root: true, ctl: "val", kind: "text", ph: "SYNFIN", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Build your own TCP scan by naming the flags to set.", detail: "Combine URG, ACK, PSH, RST, SYN and FIN. For experimenting with how a host reacts to odd packets.", when: "Research into TCP behaviour.", eg: "nmap --scanflags SYNFIN 10.0.0.1" });
def({ k: "idle", cat: "technique", flag: "-sI", title: "Idle scan", lvl: 3, noise: 1, root: true, ctl: "val", kind: "text", ph: "zombie-host", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Scan through a third \"zombie\" host so the target never sees your address.", detail: "A clever technique that bounces the scan off an idle host by watching its IP ID counter. Slow and needs a suitable zombie. Use only where you are authorized.", when: "Research and authorized stealth testing.", eg: "nmap -sI zombie 10.0.0.1" });
def({ k: "bounce", cat: "technique", flag: "-b", title: "FTP bounce scan", lvl: 3, noise: 1, ctl: "val", kind: "text", ph: "user:pass@ftp", grp: "TCP method (choose one)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Scan through an old FTP server that allows proxy transfers.", detail: "A historical technique. Almost all modern FTP servers block it.", when: "Legacy environments only.", eg: "nmap -b ftp.example.com 10.0.0.1" });
def({ k: "sU", cat: "technique", flag: "-sU", title: "UDP scan", lvl: 2, noise: 3, root: true, slow: true, ctl: "bool", grp: "Also scan (add to the above)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Check UDP services such as DNS (53), DHCP (67) and SNMP (161).", detail: "UDP has no handshake. Silent ports are reported open|filtered. Rate limits on error replies make UDP scans much slower than TCP.", when: "You need UDP services.", eg: "nmap -sU -sS scanme.nmap.org" });
def({ k: "sY", cat: "technique", flag: "-sY", title: "SCTP INIT scan", lvl: 3, noise: 2, root: true, ctl: "bool", grp: "Also scan (add to the above)", ref: "PORT SCANNING TECHNIQUES",
  summary: "The SCTP equivalent of the SYN scan.", detail: "SCTP is used in telephony signalling. Fast and clear where SCTP is present.", when: "Telecom networks.", eg: "nmap -sY 10.0.0.1" });
def({ k: "sZ", cat: "technique", flag: "-sZ", title: "SCTP COOKIE-ECHO scan", lvl: 3, noise: 2, root: true, ctl: "bool", grp: "Also scan (add to the above)", ref: "PORT SCANNING TECHNIQUES",
  summary: "A stealthier SCTP scan.", detail: "Open SCTP ports silently drop the probe, so it is less obvious than -sY.", when: "Telecom networks, more quietly.", eg: "nmap -sZ 10.0.0.1" });
def({ k: "sO", cat: "technique", flag: "-sO", title: "IP protocol scan", lvl: 3, noise: 2, root: true, ctl: "bool", grp: "Also scan (add to the above)", ref: "PORT SCANNING TECHNIQUES",
  summary: "Find which IP protocols (TCP, UDP, ICMP, ...) a host supports.", detail: "Not a port scan. It tells you whether the host answers for each protocol number, which helps profile routers and gateways.", when: "Profiling a router or gateway.", eg: "nmap -sO 10.0.0.1" });

/* PORTS */
def({ k: "ports", cat: "ports", flag: "", title: "Top 1000 ports", lvl: 1, noise: 2, ctl: "radio", field: "ports", val: "default", grp: "Which ports", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "The 1000 most common ports (the default).", detail: "Nmap ranks ports by how often they are found open (the nmap-services data). The top 1000 cover most services you will meet.", when: "Most scans.", eg: "nmap scanme.nmap.org" });
def({ k: "ports", cat: "ports", flag: "-F", title: "Fast: top 100", lvl: 1, noise: 1, quiet: true, ctl: "radio", field: "ports", val: "F", grp: "Which ports", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Only the 100 most common ports.", detail: "About ten times fewer than the default. Quick, but misses less common services.", when: "A fast first look at many hosts.", eg: "nmap -F scanme.nmap.org" });
def({ k: "ports", cat: "ports", flag: "--top-ports", title: "Top N ports", lvl: 2, noise: 2, ctl: "radio", field: "ports", val: "top", grp: "Which ports", sub: "topN", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Choose how many of the most common ports to scan.", detail: "--top-ports 20 scans the 20 most common; --top-ports 5000 scans more than the default.", when: "Something between -F and the default.", eg: "nmap --top-ports 20 scanme.nmap.org" });
def({ k: "ports", cat: "ports", flag: "-p", title: "Specific ports", lvl: 1, noise: 1, ctl: "radio", field: "ports", val: "custom", grp: "Which ports", sub: "portList", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "List exactly which ports to scan.", detail: "Examples: 22 ; 22,80,443 ; 1-1024 ; U:53,T:80 for UDP and TCP. Listed ports always appear in the results.", when: "You know the service you want.", eg: "nmap -p 22,80,443 scanme.nmap.org" });
def({ k: "ports", cat: "ports", flag: "-p-", title: "All 65535 ports", lvl: 2, noise: 4, slow: true, ctl: "radio", field: "ports", val: "all", grp: "Which ports", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Every TCP port from 1 to 65535.", detail: "Finds services hidden on unusual ports. Often 10 to 60 times slower than the default.", when: "A thorough check of one host.", eg: "nmap -p- scanme.nmap.org" });
def({ k: "excludePorts", cat: "ports", flag: "--exclude-ports", title: "Exclude ports", lvl: 3, noise: 0, ctl: "val", kind: "text", ph: "80,443", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Leave specific ports out of the scan.", detail: "Removes ports from whatever set you chose above.", when: "You must avoid a sensitive service.", eg: "nmap -p- --exclude-ports 9100 10.0.0.1" });
def({ k: "topN", cat: "ports", flag: "--top-ports", title: "Number of top ports", lvl: 2, noise: 0, ctl: "val", kind: "num", ph: "100", dep: "ports", depVal: "top", hidden: true, ref: "PORT SPECIFICATION AND SCAN ORDER", summary: "", detail: "", when: "", eg: "" });
def({ k: "portList", cat: "ports", flag: "-p", title: "Port list", lvl: 1, noise: 0, ctl: "val", kind: "text", ph: "22,80,443", dep: "ports", depVal: "custom", hidden: true, ref: "", summary: "", detail: "", when: "", eg: "" });
def({ k: "seq", cat: "ports", flag: "-r", title: "Scan in order", lvl: 3, noise: 0, ctl: "bool", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Scan ports in numeric order instead of randomized.", detail: "Nmap randomizes port order by default to be less predictable. -r makes it sequential, which is easier to read but more obvious.", when: "Debugging or readable output.", eg: "nmap -r scanme.nmap.org" });
def({ k: "portRatio", cat: "ports", flag: "--port-ratio", title: "Ports by frequency", lvl: 3, noise: 2, ctl: "val", kind: "text", ph: "0.05", ref: "PORT SPECIFICATION AND SCAN ORDER",
  summary: "Scan every port more common than this ratio (0 to 1).", detail: "--port-ratio 0.05 scans ports found open on at least 5% of hosts in Nmap's data.", when: "You want a frequency cutoff rather than a fixed count.", eg: "nmap --port-ratio 0.05 scanme.nmap.org" });

/* SERVICE / VERSION */
def({ k: "sV", cat: "detection", flag: "-sV", title: "Service version detection", lvl: 1, noise: 3, ctl: "bool", ref: "SERVICE AND VERSION DETECTION",
  summary: "Ask each open port which program and version is running.", detail: "Nmap sends probes and matches replies against thousands of signatures. \"Port 80 open\" becomes \"Apache httpd 2.4.7\".", when: "You want to know what is really running.", eg: "nmap -sV scanme.nmap.org" });
def({ k: "versionIntensity", cat: "detection", flag: "--version-intensity", title: "Version intensity", lvl: 3, noise: 1, ctl: "val", kind: "num", ph: "7", dep: "sV", ref: "SERVICE AND VERSION DETECTION",
  summary: "How many probes version detection tries, from 0 to 9.", detail: "Higher finds more unusual services but is slower and noisier. 7 is the default.", when: "Tuning depth versus speed.", eg: "nmap -sV --version-intensity 9 scanme.nmap.org" });
def({ k: "versionLight", cat: "detection", flag: "--version-light", title: "Light version detection", lvl: 2, noise: 2, ctl: "bool", dep: "sV", ref: "SERVICE AND VERSION DETECTION",
  summary: "Try only the most likely probes (intensity 2).", detail: "Much faster, identifies common services, misses rare ones.", when: "Speed matters more than completeness.", eg: "nmap -sV --version-light scanme.nmap.org" });
def({ k: "versionAll", cat: "detection", flag: "--version-all", title: "All version probes", lvl: 2, noise: 3, slow: true, ctl: "bool", dep: "sV", ref: "SERVICE AND VERSION DETECTION",
  summary: "Try every probe (intensity 9).", detail: "The most thorough and the slowest version detection.", when: "An unknown or stubborn service.", eg: "nmap -sV --version-all scanme.nmap.org" });
def({ k: "versionTrace", cat: "detection", flag: "--version-trace", title: "Version trace", lvl: 3, noise: 0, ctl: "bool", dep: "sV", ref: "SERVICE AND VERSION DETECTION",
  summary: "Print detailed version-detection activity.", detail: "A debugging view of every probe and reply during version detection.", when: "Debugging detection.", eg: "nmap -sV --version-trace scanme.nmap.org" });

/* SCRIPTS */
def({ k: "sC", cat: "scripts", flag: "-sC", title: "Default scripts", lvl: 1, noise: 3, ctl: "bool", ref: "NMAP SCRIPTING ENGINE (NSE)",
  summary: "Run the scripts in the \"default\" category.", detail: "Same as --script=default. Collects page titles, SSH keys, SMB details and more. Chosen to be useful and fairly safe, though a few are intrusive.", when: "You want extra detail about the services found.", eg: "nmap -sC scanme.nmap.org" });
def({ k: "scripts", cat: "scripts", flag: "--script", title: "Choose scripts", lvl: 1, noise: 3, ctl: "scripts", ref: "NMAP SCRIPTING ENGINE (NSE)",
  summary: "Pick exact scripts or categories from the 600+ available.", detail: "Open the Scripts browser to search all categories and add scripts. They become --script=name1,name2.", when: "You want specific checks, for example a vulnerability test.", eg: "nmap --script=http-title,ssh-hostkey scanme.nmap.org" });
def({ k: "scriptArgs", cat: "scripts", flag: "--script-args", title: "Script arguments", lvl: 2, noise: 0, ctl: "val", kind: "text", ph: "user=admin,pass=secret", dep: "scriptsAny", ref: "NMAP SCRIPTING ENGINE (NSE)",
  summary: "Pass settings to the scripts you selected.", detail: "Comma-separated name=value pairs. The Scripts browser shows which arguments each script accepts.", when: "A script needs credentials or options.", eg: "nmap --script=http-enum --script-args http-enum.basepath=/app/ host" });
def({ k: "scriptArgsFile", cat: "scripts", flag: "--script-args-file", title: "Script args from file", lvl: 3, noise: 0, ctl: "val", kind: "file", ph: "args.txt", dep: "scriptsAny", ref: "NMAP SCRIPTING ENGINE (NSE)",
  summary: "Read script arguments from a file.", detail: "Keeps long or secret argument lists out of the command line.", when: "Many or sensitive arguments.", eg: "nmap --script=... --script-args-file args.txt host" });
def({ k: "scriptTrace", cat: "scripts", flag: "--script-trace", title: "Script trace", lvl: 3, noise: 0, ctl: "bool", dep: "scriptsAny", ref: "NMAP SCRIPTING ENGINE (NSE)",
  summary: "Show all data scripts send and receive.", detail: "A debugging view of script network activity.", when: "Debugging a script.", eg: "nmap -sC --script-trace host" });

/* OS */
def({ k: "O", cat: "os", flag: "-O", title: "OS detection", lvl: 1, noise: 3, root: true, ctl: "bool", ref: "OS DETECTION",
  summary: "Guess the operating system from how the host answers.", detail: "Nmap sends unusual TCP, UDP and ICMP probes and matches small details (TTL, window size, option order) against its fingerprint database. Needs one open and one closed port to be reliable.", when: "Is it Linux, Windows, a router or a printer?", eg: "nmap -O scanme.nmap.org" });
def({ k: "osscanLimit", cat: "os", flag: "--osscan-limit", title: "Limit OS detection", lvl: 2, noise: 0, ctl: "bool", dep: "O", ref: "OS DETECTION",
  summary: "Only attempt OS detection on promising hosts.", detail: "Skips hosts without at least one open and one closed port, which saves time on large scans.", when: "OS detection over many hosts.", eg: "nmap -O --osscan-limit 192.168.1.0/24" });
def({ k: "osscanGuess", cat: "os", flag: "--osscan-guess", title: "Guess OS aggressively", lvl: 2, noise: 0, ctl: "bool", dep: "O", ref: "OS DETECTION",
  summary: "Offer the closest matches even when Nmap is not sure.", detail: "Shows likely guesses with a percentage instead of giving up on an imperfect match.", when: "No exact fingerprint match.", eg: "nmap -O --osscan-guess 10.0.0.1" });

/* TIMING */
["0","1","2","3","4","5"].forEach((v) => {
  const meta = { "0": ["Paranoid", "Waits 5 minutes between probes. For evading detection; a 1000-port scan takes days.", 0, true],
    "1": ["Sneaky", "Waits 15 seconds between probes. Also for avoiding detection. Still extremely slow.", 0, true],
    "2": ["Polite", "Waits 0.4 s between probes to use less bandwidth. About ten times slower than normal.", 1, true],
    "3": ["Normal", "The default speed, written out explicitly.", 2, false],
    "4": ["Aggressive", "Assumes a fast, reliable network. Recommended for modern broadband and LANs.", 3, false],
    "5": ["Insane", "Assumes an extremely fast network and may miss ports on slow links.", 4, false] }[v];
  def({ k: "timing", cat: "timing", flag: "-T" + v, title: meta[0], lvl: v === "3" || v === "4" ? 1 : 2, noise: meta[2], quiet: meta[3], slow: v === "0" || v === "1" || v === "2",

const BYID = {}; ALLOPTS.forEach((o) => { BYID[o.id] = o; });

const GENERIC_VAL = {}, GENERIC_BOOL = {};
ALLOPTS.forEach((o) => {
  if (o.hidden || o.field || !o.flag) return;
  if (o.ctl === "val" && o.grp !== "Probe types (combine freely)") GENERIC_VAL[o.flag] = o.k;

/* ---------- State ---------- */
function defaults() {
  const f = { disc: "default", dns: "default", tcp: "default", ports: "default", timing: "default" };
  const v = {};
  ALLOPTS.forEach((o) => {
    if (o.field || o.hidden) return;
    if (o.ctl === "bool") v[o.k] = false;
    else if (o.ctl === "scripts") v[o.k] = [];
    else v[o.k] = "";
  });
  v.target = "scanme.nmap.org"; v.reason = true; v.topN = "100"; v.portList = "22,80,443";
  return { f: f, v: v };
}
let state = defaults();
// backend: app.py answered /api/env; live: backend found nmap, so scans are real.
const env = { privileged: false, expert: false, theme: "system", localIp: "192.168.1.73", subnet: "192.168.1.0/24",
  backend: false, live: false, nmapVersion: "", nmapPath: "", iface: "" };
const ui = { screen: "start", cat: "target", info: "target", editing: false, showSetup: false, showExplain: false,
  copied: false, unknown: [], showAdv: {}, search: "", warnsOpen: false };
const nse = { q: "", cats: new Set(), sel: null };
let scan = null, scanToken = 0;
// Saved scans from app.py. list is null until the first load.
const hist = { list: null, error: "", sel: [], diff: null, diffErr: "" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const effTcp = () => (state.f.tcp !== "default" ? state.f.tcp : (env.privileged ? "sS" : "sT"));
const scriptsAny = () => state.v.sC || (state.v.scripts && state.v.scripts.length > 0);
function active(o) {
  if (o.field) return state.f[o.field] === o.val;
  if (o.ctl === "bool") return state.v[o.k] === true;
  if (o.ctl === "scripts") return (state.v[o.k] || []).length > 0;
  return String(state.v[o.k] || "").trim() !== "";
}
function depActive(o) {
  if (!o.dep) return true;
  if (o.dep === "sV") return state.v.sV;
  if (o.dep === "O") return state.v.O;
  if (o.dep === "scriptsAny") return scriptsAny();
  return true;
}
function clearOpt(o) {
  if (o.field) state.f[o.field] = "default";
  else if (o.ctl === "bool") state.v[o.k] = false;
  else if (o.ctl === "scripts") state.v[o.k] = [];
  else state.v[o.k] = "";
}

/* ---------- Command model ---------- */
function buildArgs() {
  const a = [];
  const v = state.v, f = state.f;
  const push = (text, o) => a.push({ text: text, id: o ? o.id : null, opt: o || null });
  const val = (o) => String(v[o.k] || "").trim();
  // Free text with spaces is quoted so the command still works when pasted in a terminal.
  const quoted = (s) => (/\s/.test(s) ? '"' + s.replace(/"/g, "") + '"' : s);
  const emitVal = (key, pre) => { const o = BYID[key]; if (o && val(o)) push((pre || o.flag) + " " + quoted(val(o)), o); };
  const emitProbe = (key) => { const o = BYID[key]; if (!o) return; if (o.ctl === "bool") { if (v[o.k]) push(o.flag, o); } else { push(o.flag + val(o), o); } };
  // techniques
  if (f.tcp !== "default") { const o = BYID["tcp:" + f.tcp]; push(o.flag, o); }
  emitVal("scanflags"); emitVal("idle", "-sI"); emitVal("bounce", "-b");
  ["sU", "sY", "sZ", "sO"].forEach((k) => { if (v[k]) push(BYID[k].flag, BYID[k]); });
  // discovery
  if (f.disc !== "default") { const o = BYID["disc:" + f.disc]; push(o.flag, o); }
  ["PE", "PP", "PM"].forEach((k) => { if (v[k]) push(BYID[k].flag, BYID[k]); });
  ["PS", "PA", "PU", "PY", "PO"].forEach((k) => { if (v[k]) emitProbe(k); });
  if (f.dns !== "default") { const o = BYID["dns:" + f.dns]; push(o.flag, o); }
  if (v.systemDns) push("--system-dns", BYID.systemDns);
  emitVal("dnsServers"); if (v.traceroute) push("--traceroute", BYID.traceroute);
  // ports
  if (f.ports === "F") push("-F", BYID["ports:F"]);
  else if (f.ports === "top") push("--top-ports " + (val(BYID.topN) || "100"), BYID["ports:top"]);
  else if (f.ports === "custom") push("-p " + (val(BYID.portList) || "?"), BYID["ports:custom"]);
  else if (f.ports === "all") push("-p-", BYID["ports:all"]);
  emitVal("excludePorts"); if (v.seq) push("-r", BYID.seq); emitVal("portRatio");
  // detection
  if (v.sV) push("-sV", BYID.sV);
  if (depActive(BYID.versionIntensity)) emitVal("versionIntensity");
  if (v.versionLight && state.v.sV) push("--version-light", BYID.versionLight);
  if (v.versionAll && state.v.sV) push("--version-all", BYID.versionAll);
  if (v.versionTrace && state.v.sV) push("--version-trace", BYID.versionTrace);
  // scripts
  if (v.sC) push("-sC", BYID.sC);
  if (v.scripts && v.scripts.length) push("--script=" + v.scripts.join(","), BYID.scripts);
  if (scriptsAny()) { emitVal("scriptArgs"); emitVal("scriptArgsFile"); if (v.scriptTrace) push("--script-trace", BYID.scriptTrace); }
  // OS
  if (v.O) push("-O", BYID.O);
  if (v.osscanLimit && v.O) push("--osscan-limit", BYID.osscanLimit);
  if (v.osscanGuess && v.O) push("--osscan-guess", BYID.osscanGuess);
  // timing
  if (f.timing !== "default") { const o = BYID["timing:" + f.timing]; push(o.flag, o); }
  ["minRate", "maxRate", "minParallelism", "maxParallelism", "minHostgroup", "maxHostgroup", "maxRetries",
   "hostTimeout", "scanDelay", "maxScanDelay", "initialRtt", "minRtt", "maxRtt"].forEach((k) => emitVal(k));
  // evasion
  if (v.frag) push("-f", BYID.frag);
  ["mtu", "decoys", "spoofSrc", "iface", "sourcePort", "proxies", "dataLength", "dataString", "data", "ipOptions", "ttl", "spoofMac"].forEach((k) => emitVal(k));
  if (v.badsum) push("--badsum", BYID.badsum);
  // output (on screen)
